[tox]
# envlist mirrors pyproject.toml classifiers (the source of truth);
# tests/test_version_sync.py fails if they drift.
envlist = py312, py313, lint, typecheck
minversion = 4.0

[testenv]
description = Run tests with pytest
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=ddlgenerator --cov-report=term-missing --cov-fail-under=80 --tb=short {posargs}

[testenv:lint]
description = Run linting with ruff and flake8
deps =
    ruff
    flake8
commands =
    ruff check ddlgenerator/ tests/
    flake8 ddlgenerator/ tests/

[testenv:typecheck]
description = Run static type checking with mypy (optional)
deps =
    mypy
    types-python-dateutil
    types-requests
    types-PyYAML
commands =
    mypy ddlgenerator/

[testenv:coverage]
description = Generate coverage report
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=ddlgenerator --cov-report=html --cov-report=term {posargs}

# Not in the default envlist: needs a running Docker daemon.
[testenv:integration-postgres]
description = PostgreSQL integration tests against a real server (requires Docker)
deps =
    pytest
extras =
    postgres
    integration
passenv =
    DOCKER_HOST
    TESTCONTAINERS_*
    DDLGEN_PG_INTEGRATION_REQUIRED
commands =
    pytest -m postgres --tb=short {posargs}
